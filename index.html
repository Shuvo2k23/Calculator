<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </div>
    <div class="keys">
      <button class="key action" id="ac">AC</button>
      <button class="key action" id="del">DEL</button>
      <button class="key action" id="percent">%</button>
      <button class="key operator" id="divide">/</button>

      <button class="key digit" data-number>7</button>
      <button class="key digit" data-number>8</button>
      <button class="key digit" data-number>9</button>
      <button class="key operator" id="multiply">*</button>

      <button class="key digit" data-number>4</button>
      <button class="key digit" data-number>5</button>
      <button class="key digit" data-number>6</button>
      <button class="key operator" id="subtract">-</button>

      <button class="key digit" data-number>1</button>
      <button class="key digit" data-number>2</button>
      <button class="key digit" data-number>3</button>
      <button class="key operator" id="add">+</button>

      <button class="key action" id="sign">+/-</button>
      <button class="key digit" data-number>0</button>
      <button class="key digit" data-number>.</button>
      <button class="key operator" id="equals">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
